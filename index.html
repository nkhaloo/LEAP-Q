<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="LEAP-Q (full)">
  <meta name="color-scheme" content="light">
  <title>LEAP-Q (full)</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="qsf-data.js" defer></script>
  <script src="questionnaire.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="main">
    <noscript><p class="notice">Please enable JavaScript to complete this questionnaire.</p></noscript>
    <div id="setup-notice" class="notice" hidden>Submission is not configured. Please contact the researcher.</div>
    <form id="survey" novalidate>
      <div id="errors" class="error-summary" role="alert" tabindex="-1" hidden></div>
      <div id="panel"></div>
      <div class="actions"><button type="submit" id="next" aria-label="Next">→</button></div>
    </form>
    <p id="submission-status" role="status" aria-live="polite"></p>
    <p id="storage-note">Your progress is saved on this device for up to one week.</p>
  </main>
</body>
</html>
